    --blue: #7ea6ff; --blue-soft: #1d2a47; --tiger: #f0954a; --on-blue: #0d1320; color-scheme: dark;
  }
}

  --bg: #0d1320; --surface: #151d2e; --ink: #e6ebf3; --muted: #9aa6ba; --line: #2a3550;
  --blue: #7ea6ff; --blue-soft: #1d2a47; --tiger: #f0954a; --on-blue: #0d1320; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  display: flex; flex-direction: column;
}
.wrap { width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { border-bottom: 1px solid var(--line); background: var(--surface); }
header .wrap { display: flex; align-items: center; gap: 14px; padding-block: 12px; }

  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .02em; }

.sub b { color: var(--tiger); font-weight: 600; }
.topics { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.topics:hover { border-color: var(--blue); }
.src { margin-top: 10px; font-size: 12px; color: var(--muted); }
.src .pg { margin-right: 6px; }
.esc { margin-top: 10px; font-size: 13px; color: var(--ink); background: var(--blue-soft); border-radius: 10px; padding: 8px 12px; }
.esc b { color: var(--tiger); }
.rel { margin-top: 10px; }
.rel .lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.bubble table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.bubble td, .bubble th { border-bottom: 1px solid var(--line); padding: 3px 14px 3px 0; text-align: left; }
.tablewrap { overflow-x: auto; max-height: 320px; overflow-y: auto; }
main { flex: 1; overflow-y: auto; }
#log { display: flex; flex-direction: column; gap: 18px; padding-block: 22px 28px; }
.msg { display: flex; gap: 12px; min-width: 0; }
.msg .who { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 13px; background: var(--blue); color: var(--on-blue); }
.msg.user { flex-direction: row-reverse; }
.msg.user .who { background: var(--line); color: var(--ink); }

button.send { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase;
  border: 0; border-radius: 12px; background: var(--blue); color: var(--on-blue); padding: 10px 18px; cursor: pointer; }

<script type="application/json" id="guide">"[Page 1]\nFall 2026\nAFROTC DETACHMENT 355\nCADET GUIDE\nMors Ab Alto (Death From Above)\n\n[Page 2]\nIntroduction\nWelcome to Air Force Reserve Officer Training Corps (AFROTC)\nDetachment 355, home of the Flying Tigers! The purpose of this guide\nis to provide a reference, a database, and some general guidance\nregarding cadet knowledge for our Cadet Wing (CW), AFROTC, the\nUnited States Air Force (USAF), and the United States Space Force\n(USSF). It is highly recommended that you read through this guide in\nits entirety, as it contains critical information for your success as an\nAFROTC cadet and college student.\nIf there are any questions or concerns regarding the Cadet Guide,\nask your fellow cadets first, then your Squadron Commander.\n***This Cadet Guide is Current as of Fall 2026***\nCadet Wing Commander (CW/CC) Introduction:\nFlying Tigers,\nWhat\u2019s up studs! I am Jacob Hutchison, and I am your Fall 2026 Cadet Wing\nCommander. I am currently studying Leadership at Boston College. In my personal time I\nlove to train, do anything related to the outdoors, and read books. I am super excited to\nget after it with you all this fall as we each get one step closer towards commissioning\nand growing closer as a Flying Tigers family. Don\u2019t forget to keep your \u201cwhy\u201d on the\nfront of your mind. When things get tough, remember - it\u2019s just pain. You can do\nanything you put your mind to. If you need anything at all, do not hesitate to reach out\n(314-853-4551). I am here to serve you on your journey towards commissioning.\n- Cadet Colonel Hutchison\n\n[Page 3]\nCadet Deputy Wing Commander (CW/CD) Introduction:\nFlying Tigers,\nMy name is Cayden Dinkler, and I'm a senior at Boston University studying\nMechanical Engineering. I was born in California but spent most of my life growing up in\nBahrain, a small country in the Middle East, before coming back to the U.S. for college.\nLiving overseas introduced me to people from all kinds of backgrounds, and it's taught\nme that everyone has something valuable to bring to the table. I'm excited to serve as\nyour Deputy Wing Commander this semester and, more importantly, get to know all of\nyou. If there's one thing I'd encourage you to do, it's to lean into the uncomfortable\nmoments. They're usually where you grow the most. Say yes to opportunities, even if\nthey seem a little intimidating, whether they're in AFROTC, in your classes, or just in\nlife. And through it all, don't lose who you are. Nobody here has the same background or\nexperiences, and that's exactly what makes this detachment stronger. Learn from the\npeople around you, enjoy the process, and remember that these four years go by a lot\nfaster than you think.\n- Cadet Colonel Dinkler\nGeneral Military Course Advisor (GMCA) Introductions:\nDetachment 355 Cadets,\nMy name is Ethan Wang, and I am a Junior at Boston University studying Health\nScience and Pre Dental. I am hoping to become an Air Force Dentist. As your General\nMilitary Course Advisor (GMCA) this semester, my goal is to help create a welcoming\nand connected community among 100s, 150s, and 200s, as well as being someone who\nyou guys may be able to reach out for support or guidance. I aim to create an\nenvironment where GMC (General Military Course) cadets are looking forward to PMT\n(Practical Military Training) events and encourage everyone to take advantage of\nopportunities of growth both as leaders and followers. My biggest goal is to strengthen\ncommunication between the GMC cadets and the Cadet Wing Staffs. If there are any\nquestions about ROTC or just college life, I would love to help. If I can\u2019t answer your\nquestion, I will be sure to find someone who can. You can reach me at\nwang.ethan.355@gmail.com or (929) 500-5555.\n- C/3C Wang\n\n[Page 4]\nTable of Contents\nSection 1: Detachment 355 Information\n1.1 Detachment 355 Contact Information\n1.2 Cadre\n1.3 Meetings with Cadre\n1.4 Detachment/Cadet Headquarters Protocol\nSection 2: AFROTC Curriculum\n2.1 Aerospace Studies (AS) Courses\n2.2 Leadership Laboratory (LLAB)\n2.3 Physical Training (PT)\n2.4 Attendance Policy\n2.5 Air Force Officer Qualifying Test (AFOQT)\n2.6 Field Training - Victory (FT-V)\n2.7 Samples of Behavior (SOBs)\n2.8 Retention and Commissioning\nSection 3: The Cadet Wing\n3.1 Cadet Wing Organizational Chart\n3.2 Class Descriptions\n3.3 Cadet Classifications\nSection 4: Important Documents\n4.1 Physical Fitness Assessment (PFA)\n4.1.1 Height and Weight Requirements\n\n[Page 5]\n4.2 Memorandum For Record\nSection 5: Customs and Courtesies\n5.1 Crucial Information\n5.2 Ranks\nSection 6: Frequently Asked Questions (FAQs)\nSection 7: AFROTC Resources\nSection 8: Academic Resources\n8.1 Boston University\n8.2 Northeastern University\n8.3 Boston College\n8.4 Simmons University\n8.5 University of Massachusetts Boston\n8.6 Wentworth Institute of Technology\n8.7 Bridgewater State University\n8.8 Brandeis University\n8.9 Emmanuel College\n9.0 Suffolk University\nSection 9: Appendix\nA-1 Acronym\n\n[Page 6]\nSection 1: Detachment 355 Information\n1.1 Detachment 355 Contact Information\n\u2756 Detachment 355 Address:\no 118 Bay State Road, Boston, MA 02215\n\u2756 Phone Number:\no (617) 353-4705\n\u2756 General Email:\no AFROTC@bu.edu\n\u2756 Non-Commissioned Officer (NCO) Email:\no nco355@bu.edu\n1.2 Cadre\n\u2756 Lieutenant Colonel Nicholas Edwards\no Position: Detachment Commander\n(CC)/Professor of Aerospace Studies\n(PAS)\no Office: First Floor\no Email: nbedward@bu.edu\n\u25cb Phone:(765) 430-0346\n\u2756 Captain Melanie Davis\no Position: Operations Flight Commander\n(OFC)/Assistant Professor of Aerospace Studies\n(APAS)\no Office: Third Floor\no Email: mgdavis5@bu.edu\no Phone: (617) 353-6309\n\u2756 Captain Zachary Watts\n\u25cb Position: Recruiting Officer/ Assistant\nProfessor of Aerospace Studies (APAS)\n\u25cb Office: Third Floor\n\u25cb Email: zwatts11@bu.edu\n\u25cb Phone: (617) 353-6316\n\n[Page 7]\n\u2756 Technical Sergeant Autumn Zinnia\no Position: Non-Commissioned Officer in\nCharge (NCOIC)/\nAdministration Management\no Office: Second Floor\no NCO Email: azinnia@bu.edu\n\u25cb Phone: (617) 353-6308\no Personal Email: azinnia@bu.edu\n\u2756 Technical Sergeant Emily McCarthy\no Position: AFROTC Training Instructor\no Office: Second Floor\no NCO Email: emccarth@bu.edu\n\u25cb Phone: (617) 353-6307\n\u25cb Calendly: http://calendly.com/emccarthy-bu\n\u2756 Mrs. Jennifer Wilson\no Position: Department of Aerospace Studies Senior\nAdministrative Secretary\no Office: First Floor\no Email: wilson12@bu.edu\n1.3 Meetings with Cadre\n\u2756 Scheduling a Meeting:\n\u27a2 To schedule a meeting with a cadre, first look at their Boston\nUniversity (BU) email on Google Calendar to check their\navailability. If you do not have access to their calendar for a\nmeeting, you may politely request access via email. Then, email\nthem with a date, time, and purpose of the meeting. Include an\nalternative time and/or day when requesting an appointment.\nOnce the cadre member responds with a confirmation, they will\nprovide you with the times that work for them. If the time does\nnot work for the cadre member, they will reply and propose a\nnew time. For midterm feedbacks and AS class specific\nmeetings, refer to your AS class syllabus for scheduling\n\n[Page 8]\ninstructions.\n\u27a2 Template scheduling email:\nFollow this template when scheduling a meeting with cadre.\n\u2756 Meeting with Cadre:\n\u27a2 Arrive at 118 Bay State Road and go through the back door to\nCadet Headquarters (CHQ). The door code will be provided to\nyou at the start of the semester. Aim to arrive at the CHQ at least\n10 minutes early. If the CHQ is closed, ring the doorbell at the\nfront door.\n\u2756 Calling Up:\n\u27a2 You should call the cadre member\u2019s office at the scheduled\nmeeting time. For example, if your meeting is at 1300, call\nexactly at 1300. Use the CHQ phone to call the office of the\ncadre member you are meeting with. Dial their extension and\nuse the following verbiage: \u201cGood\n(morning/afternoon/evening) sir/ma\u2019am. This is Cadet (last\nname). I am here for my meeting at (time).\u201d Cadre will then\ngive you instructions. When meeting with an officer, you will\nreport in (see below for reporting in procedures). Otherwise, you\nare still expected to greet the person you are meeting. If you are\ngoing to be late or you are unable to attend a meeting, let the\nCadre member know as soon as possible (via phone or email).\nOnce directed to report to the cadre member\u2019s office, utilize the\nsmall interior staircase to reach the ground floor, then proceed\nup the main staircase to the correct floor. Do not use the\nstaircase next to the bathroom. This staircase leads directly to\nthe commander\u2019s office and is not proper procedure, even when\nmeeting with the commander.\n\u2756 Reporting in:\n\u27a2 When meeting with an officer, you must use the following\nformal process. First, center yourself on the office door and\nknock once loudly. If the door is open, knock once on the\ndoorframe. When given the command to enter, march to two\npaces in front of the officer, squaring your corners on hardwood\n[Image content: Template scheduling email] Good [morning/afternoon/evening] [Rank Last Name], I would like to schedule a meeting regarding [purpose of meeting]. I checked your calendar and am available at the following times: [Option 1: Day, Date, Time] [Option 2: Day, Date, Time]. Please let me know if any of these times work for you. If not, let me know a time that fits your schedule and I will adjust accordingly. Thank you. V/r, Cadet [Last Name], followed by your signature block.\n\n[Page 9]\nand rounding them on carpet. Salute and say, \u201cSir/ma\u2019am,\nCadet (last name) reports as ordered.\u201d Do not drop your\nsalute until the officer does. Do not salute NCOs when reporting\nin. Stay at the position of attention unless told otherwise. At the\nconclusion of the meeting, ask, \u201cWill that be all Sir/Ma\u2019am?\u201d\nIf the officer says, \u201cThat will be all,\u201d resume the position of\nattention and take one step back, starting with the left foot with a\ncoordinated arm swing. Salute and render the proper greeting of\nthe day. Once the officer drops their salute, perform the\nappropriate facing movements towards the exit, and leave as\nquickly as possible. Leave the door open or closed, depending\non how you originally found it.\n1.4 Detachment/Cadet Headquarters Protocol\n\u2756 Purpose: The CHQ provides a space for AFROTC cadets to hang out,\ndo homework, or meet for wing-related activities. The CHQ is in the\nbasement of the detachment and is composed of the front room and the\nhangar.\n\u2756 Entering: When entering the CHQ alone, you must say, \u201cJust me.\u201d If\nyou are entering with a group of cadets, the first person to enter says,\n\u201cJust us.\u201d Do not enter through the front door of the detachment (when\nthe CHQ is open). Do not use the back staircase in the CHQ closest to\nthe bathroom, as it leads directly to the commander\u2019s office.\n\u2756 Calling the Room: If you hear someone open the door or come down\nthe stairs, and they do not call out, \u201cJust me,\u201d or \u201cJust us,\u201d assume it is a\ncadre member. When an officer cadre member enters the room and you\nare with other cadets, call the room to attention. If you are alone, stand\nat the position of attention and render the proper greeting of the day. If\nthe cadre member is an NCO, you do not need to call the room to\nattention, but you must give the appropriate greeting of the day. If you\nare in the hangar (the back room), you only need to render the proper\ngreeting of the day.\n\u2756 Rules:\n\u27a2 CHQ is closed to cadets from 0000 to 0500.\n\u27a2 Non-ROTC personnel need prior cadre approval to enter CHQ.\nWithout approval, it will be reported as a security violation.\n\u27a2 Sister Service ROTC cadets must be signed in using the QR\ncode and accompanied by a cadet sponsor, who is responsible\nfor them. They cannot be given the code or left alone.\n\u27a2 Maintain professionalism and render proper greetings to the\ncadre. Failure to do so will result in verbal counseling.\n\u27a2 Label food/drinks in the fridge with your name and date.\nRemove perishable items within a week to avoid counseling.\n\u27a2 For computer/printer issues, email the LOGO immediately with\ndetails.\n\u27a2 Pick up cadet mail at least every two weeks.\n\n[Page 10]\n\u27a2 Use the coat rack for outerwear to keep the area neat.\n\u27a2 Use the white bin for trash and the blue bin for recyclables.\n\u27a2 Approval from the LOGO is required for any items stored in the\nCHQ.\n\u27a2 Turn off lights and electronics when leaving.\n\u2756 Amenities: The CHQ includes beverages and personal hygiene items.\n\u27a2 Cadets may use the Keurig Coffee maker at any time. Throw out\nthe K-cups after each use. While the coffee is complimentary, a\ndonation of fifty cents is recommended to keep a steady supply.\nThere will be a labeled tin to put in coins or cash near the Keurig\nCoffee maker.\n\u27a2 Cadets may purchase snack items offered in the CHQ by\nscanning the QR code above the snack center. Fill out the form\nas appropriate and make a Venmo payment to the listed account.\n\u27a2 The current personal hygiene amenities within the CHQ include\ndisposable razors, shaving cream, breath mints, lotion, nail\npolish remover, and nail clippers.\nSection 2: AFROTC Curriculum\n2.1 Aerospace Studies (AS) Courses - Fall & Spring\nAS100\n\u2794 AS 110 & AS 120: Heritage and Values (1 credit)\n\u25cf Description: A survey course designed to introduce students to\nthe USAF and USSF, providing an overview of the organizations\nand their missions and characteristics.\nAS200\n\u2794 AS 212 & AS 222: Team and Leadership Fundamentals (1 credit)\n\u25cf Description: Focuses on laying the foundation for teams and\nleadership. The topics include skills that will allow cadets to\nimprove their leadership on a personal level and within a team.\nThis course will prepare cadets for their Field Training and\nProfessional Officer Course (POC) experience where they will\nbe able to put the concepts learned into practice. The purpose is\nto instill a leadership mindset and to motivate underclassmen to\ntransition from an AFROTC cadet to an AFROTC officer\ncandidate.\nAS300\n\u2794 AS 310 & AS 320: Leading People and Effective Communication (3\ncredits)\n\n[Page 11]\n\u25cf Description: Teaches cadets advanced skills and knowledge in\nmanagement and leadership. Special emphasis is placed on\nenhancing leadership skills and communication. Cadets have an\nopportunity to try out these leadership and management\ntechniques in a supervised environment as upperclassmen.\nAS400\n\u2794 AS 410 & AS 420: National Security Affairs and Preparation for\nActive Duty (3 credits)\n\u25cf Description: Study of the military's role as an institution in a\ndemocratic society. Topics include civil-military interaction and\nthe military as a profession. Emphasis on developing\ncommunication skills through student presentations.\n2.2 Leadership Laboratory (LLAB)\n\u2756 LLAB occurs every Wednesday from 1630 to 1900, unless otherwise\nstated by the weekly Operations Order (OPORD). It is mandatory Cadet\nWing training that provides cadets with the feedback, leadership,\nfollowership, and supervision opportunities that are imperative to grow\nas an officer candidate. Although supervised by the Detachment\nCommander (Det/CC) and Operations Flight Commander (OFC), LLAB\nis planned, organized, and executed primarily by POC cadets.\n\u2756 Uniform: It is required that you come to LLAB in the Uniform of the\nDay (UOD). The UOD must be worn the whole day (0800 until the end\nof LLAB). The UOD will be sent out with the weekly Operations Order\n(OPORD) along with the LLAB schedule. If a cadet cannot wear the\nuniform as required on LLAB days (e.g. chemistry lab or job), you must\nsubmit a Memorandum for Record (MFR) to your immediate\nsupervisor. The MFR must be sent up the chain for approval by the\nOFC. This memorandum should reach the OFC NLT two weeks before\nthe beginning of the semester or as soon as possible.\n\u2756 Materials: It is expected that you bring a conservative-colored water\nbottle, a black backpack, a small black notebook (preferably one that\nfits in your pocket), a conservative wrist watch, and a pen or pencil to\nclass. Also, lint rollers, scissors, and quick shine are useful for\nlast-minute uniform touch-ups.\n2.3 Physical Training (PT)\n\u2756 PT normally occurs every Tuesday and Friday from 0550-0650 for\ncadets in the local area, except Bridgewater State University (BSU) and\nthe University of Massachusetts Boston (UMB). Cadets from BSU or\nUMB do not need to submit an alternate PT request MFR to the OFC,\nand are placed on Alt PT automatically.\n\n[Page 12]\n\u2756 PT sessions will normally be held at Boston University, except for Alt\nPT cadets. Check the weekly OPORD for specific addresses.\n\u2756 Cadets not in the local area will be on Alt PT wherever they are located.\n\u2756 PT is designed to help improve and maintain cadet fitness and unit\ncohesion. It mostly consists of cardiovascular and body-weight\nworkouts.\n\u2756 Normally, there is a mandatory Physical Fitness Assessment (PFA) at\nleast once per semester. The first time a new cadet takes this assessment,\nit is considered a Physical Fitness Diagnostic (PFD). The PFD serves as\na baseline of where they are performing in terms of fitness.\n\u2756 In-Person PT Protocol: Cadets should aim to arrive at least 10-15\nminutes before the beginning of the PT session. The full protocol can be\nfound here. <https://docs.google.com/document/d/1FBO8wwPNCYaF8W-JBAStdy7IwMIDQyA7cUN7QPh5Uec/edit?usp=sharing>\n\u2756 Alt PT Protocol: If a cadet is on Alt PT, they must complete two\nworkouts per week listed on the OPORD (or as close as possible given\navailable facilities/space) and log their completion through this Google <https://docs.google.com/forms/d/e/1FAIpQLSenIGhtHZog_gmKA4AadOn9w0DPUbwYIzG144AmzZfUiipO0g/viewform?usp=sharing&ouid=102360289709572010157>\nForm <https://docs.google.com/forms/d/e/1FAIpQLSenIGhtHZog_gmKA4AadOn9w0DPUbwYIzG144AmzZfUiipO0g/viewform?usp=sharing&ouid=102360289709572010157> NLT 24 hours after the scheduled PT Session. Cadets are only\nrequired to complete two of the three weekly workouts. Cadets may\nchange the days they complete their weekly workouts, with the\nexpectation of weeks with Mission PTs which are mandatory on\nTuesdays. Cadets will note any changes to the workout listed on the\nOPORD due to equipment/facility restrictions they have while\ncompleting their workout.\n\u2756 Uniform/Materials: Come in your Physical Training Gear (PTG)\nunless otherwise stated. PT gear for cadets who have not been issued\ntheir PTG uniform will consist of a white t-shirt, conservative black\nshorts, and conservatively colored sneakers (The PTG uniform is earned\nwhen a cadet passes the PFA or by order of the commander). Bring a\nwater bottle and appropriate clothing if the weather is cold; safety is\nparamount. Do not forget to bring pens, forms, and headphones\n(optional) for the PFA/PFD.\n2.4 Attendance Policy\n\u2756 Cadets are required to attend all mandatory PMT events.\n\u2756 In accordance with AFROTCI 36-2011 9.10.1, all cadets must attend 80\npercent of AS classes, LLAB, and PT sessions per semester. Attendance\nwill be tracked, and failure to adhere to this policy can jeopardize\nprogram enrollment.\n\u2756 Excused absences do not count against the 80 percent minimum\nattendance standard. For example, if there are 10 LLABs in a semester,\na cadet must attend 8. If a cadet is excused from 2 LLABs, they must\nthen attend 80 percent of the 8 LLABs, which is rounded up to 7.\nExcused absences include, but are not limited to:\n\n[Page 13]\n\u27a2 Mandatory academic events (e.g, exams)\n\u27a2 Family and/or medical emergencies\n\u27a2 Illness\n\u27a2 School breaks\n\u2756 In total, there are 27 mandatory PT sessions and 14 LLABs. To adhere\nto the 80% rule, cadets must attend at least 22 PT sessions and 12\nLLABs. Missing more than 5 PT sessions or more than 2 LLABs (not\nincluding excused absences) will result in LLAB failure.\n\u2756 If your absence does not have a valid reason, then it will be considered\nan unexcused absence. Examples of unexcused absences include, but\nare not limited to:\n\u27a2 Oversleeping\n\u27a2 Non-mandatory academic event (e.g, club, study group)\n\u27a2 Studying or doing homework\n\u2756 To request an excused LLAB absence, you must submit an MFR to your\nsupervisor and the OFC NLT one week before the anticipated date of\nabsence or as soon as possible if it becomes known within that time\nframe (see Section 5.2 below).\n\u2756 If a cadet has an excuse like being sick, they must email the OFC and\ntheir immediate supervisor before the PT session. The OFC will\ndetermine if the situation constitutes an excused PT. No PT absences,\nincluding both excused and unexcused absences, need to be made up.\n\u2756 The full F2026 Attendance Policy can be found here. <https://docs.google.com/document/d/1ceHGzwGLEStQFmPG1i8ivf-VexNs7PGS/edit?usp=sharing&ouid=108150047542718133402&rtpof=true&sd=true>\n2.5 Air Force Officer Qualifying Test (AFOQT)\n\u2756 What: The AFOQT is a mandatory examination similar to the SAT or\nACT. Passing this exam is required for all cadets who meet the\nProfessional Officer Course Selection Process (PSP) Board to attend\nField Training and eventually commission. The test can be taken no\nmore than 2 times, with the opportunity for a waiverable third time.\nThis will support the PSP board and the career field classification and\nallow the AFROTC/CC to consider waivers for those cadets who can\u2019t\npass. Waivers are not guaranteed but will be based on the whole person\nconcept and the needs of the Air Force.\n\u2756 Why: AFOQT scores will be factored into a cadet\u2019s PSP Board. A cadet\nmust have passing scores in order to be nominated for the PSP Board.\nScores will also be important for entry into certain careers, such as\nmeeting Rated Board categories to become a pilot. Below are the\nminimum scores for each of the five (5) aptitude composites.\nAptitude Composite PSP\nBoard/Commissi\nRated Board\nRequirement\nRated Board Rated Board\nRequirement\n\n[Page 14]\n\u2756 Rules: Group study is now authorized as long as no one in the group\nhas EVER taken the AFOQT. The policy <https://drive.google.com/file/d/1BUEuoPQr_80eB9nnAXZytQcOIP71J84I/view?usp=drive_link> includes a required procedure\nfor the cadre to verify this about all group study participants. Use only\napproved and unaltered materials for group study. Do not store, share, or\notherwise make available any personal notes or marked/highlighted\nmaterials, and do not accept any study materials from anyone who has\never taken the AFOQT. You are only allowed to take the test twice, with\nat least 90 days between each session. Failure to adhere to these rules\nwill be seen as a massive integrity violation and will result in severe\nconsequences.\n\u2756 Detachment Testing: The AFOQT will be administered at the\nDetachment by the cadre. In our case, there will be up to two AFOQT\nsessions offered each semester where cadets may take the test (it is\nrecommended that all cadets who have not yet taken the AFOQT attend\none of these sessions). Individual sessions may also be available if\ncadets reach out to their detachment cadre.\n2.6 Field Training-Victory (FT-V)\n\u2756 What: FT-V is a multi-day training course designed to evaluate cadets\u2019\npreparedness to lead at their AFROTC detachments. It is designed to\noning\nRequirement\n(Pilot) Requirement (CSO) (ABM)\nVerbal Composite\nScore\n15 15 15 15\nQuantitative\nComposite Score\n10 10 10 10\nPilot Composite Score N/A 25 25 25\nCombat Systems\nOfficer Composite\nScore\nN/A 25 25 25\nAir Battle Manager\nComposite Score\nN/A 25 25 25\n\n[Page 15]\nplace cadets in a rigorous and unfamiliar environment, testing them\nphysically, mentally, and emotionally. Cadets are expected to arrive\nready to perform immediately. Exams and evaluations will cover the\nknowledge learned from AS100 and AS200 years and the new skills\nacquired. FT-V takes place after your last year as a GMC cadet and\nalmost always directly precedes your first year as POC. Completion of\nFT is required for commissioning.\n\u2756 Where: Field Training is typically located at Maxwell AFB, AL.\n\u2756 When: There are several iterations of 18 to 20-day encampments, or\n\u201cMAXs,\u201d throughout the summer (MAX 1, MAX 2, etc). A cadet is\nassigned to one of them, accounting for the individual's summer\navailability. As a general rule, avoid making travel plans during the\nsummer of your FT year, as FT will take precedence in most situations.\nCadets looking to achieve a Space Force EA will need to meet different\nrequirements, which include the following:\n\u27a2 US Space Force Interview (50%)\n\u25a0 Why do you want to join?\n\u25a0 Guardian Ideal\n\u25a0 USSF Core Values\n\u27a2 Detachment Relative Standing Score (30%)\n\u27a2 CGPA (15%)\n\u27a2 Physical Fitness Assessment (5%)\n\u25a0 Most recent official score\n2.7 Samples of Behavior (SOBs)\n\u2756 What: There are several learning requirements for all cadets to achieve\nthroughout their time in AFROTC. These are known as SOBs. These\nencompass a variety of competencies necessary to be a well-rounded\nofficer candidate ready for the Air and Space Forces. Below are some of\nthe ones that can be found in the AFROTCI 36-2011 Volume <https://drive.google.com/file/d/1Jn2OWvyKVd0f7lSaB1M1rioTsDzEKrm3/view?usp=sharing> 1, not\nall-inclusive.\n\u2756 Areas:\n\u27a2 Effective Followership, Leadership, and Teamwork Skills\n\u27a2 Air Force Dress and Appearance Standards\n\u27a2 Air Force Customs and Courtesies\n\u27a2 Drill Positions and Movements\n\u27a2 Preparation for FT\n2.8 Retention and Commissioning\n\u2756 In addition to the requirements already described, there are other\n\n[Page 16]\nrequirements for cadets to eventually commission. Below are a few\nexamples (but not all) that can be found in AFROTCI 36-2011 Volume <https://drive.google.com/file/d/1NMAD-EDgW-6DGSYicWN44JlWoo4tKMA9/view?usp=sharing>\n3.\n\u2756 GPA: Below is a chart that outlines GPA requirements.\n\u27a2 In addition to GPA, cadets must be a full-time student (taking\nmore than 12 credits) unless they are in their last term of the\nAFROTC program.\n\u2756 Military Retention Standards: Military retention standards include,\nbut are not limited to, moral character, bearing and behavior, physical\nfitness, professional conduct and relationships, dress and appearance,\nmeeting contracted retention standards, and other standards as\nprescribed by directives. Failure to meet any military retention standards\nmay result in dismissal from the program.\n\u2756 Physical Fitness: Cadets must be fit to fight. This includes passing the\nPFA and being within BMI and Body Fat Standards. More information\ncan be found in Section 5.3\n\u2756 Graduation and Date of Commission (DOC): Cadets who have proof\nof graduation and commission in the Fiscal Year that is associated with\ntheir DOC are eligible for commissioning.\n[Image content transcribed: Table 5.1 GPA Requirements]\nColumns: For General AFROTC Membership | To Compete in PSP | To Attend FT | To Contract | To Nominate for Scholarship | To Activate Scholarship | To Maintain Scholarship\nCumulative GPA (CGPA): 2.0 (Det/CC waivable for first-term AS100s) | 2.0 (and C or better in all AS classes) | 2.0 | 2.0 | As determined by AFROTC/CC | 2.5 | 2.5\n**Term GPA (TGPA): Not Applicable | 2.0 | 2.0 | 2.0 | As determined by AFROTC/CC | 2.5 | See Table 5.3\nEnrolled as Full-Time Student: Yes (Except for Final Term) | Yes (Spring AS200) | Yes (Spring AS200) | Yes | Yes | Yes | See Table 5.3\n*Full-Time Status Previous Term: Not applicable | Yes (Fall AS200) | Yes (Fall AS200) | Yes | Yes | Yes | See Table 5.3\n* Semester, Quarter or Trimester; Do not consider summer or Mini Terms.\n** Summer or Mini Terms are not used as TGPAs for scholarships, contracting, or Academic CEs.\nNOTE 1: Summer terms can raise or lower CGPA.\nNOTE 2: GPA requirements may be adjusted per specific board/nomination cycle. Look for board messages for exact requirements for a specific board.\nNOTE 3: Maintain the minimum term GPA requirement established by the institution or AFROTC (whichever is higher).\nDA is the waiver authority for criteria outlined in Table 5.1.\n\n[Page 17]\nSection 3: The Cadet Wing (CW)\n3.1 CW Organizational Chart (Org Chart)\nWhat: The structure of the CW is meant to resemble the structure of a real,\nactive-duty Air Force wing. This allows cadets to experience different\nleadership and followership opportunities and to have various responsibilities\nthat shape the whole organization.\nMakeup: The CW is made up of GMC and POC cadets. POC cadets are\nupperclassmen who hold various positions and perform duties similar to those\nof an officer in the Department of the Air Force (DAF). GMC cadets are\nunderclassmen who have subordinate roles within the various units of the CW,\nsimilar to that of enlisted personnel. The separation of the two allows POC\ncadets to share their knowledge and experience to help train and mentor GMC\ncadets.\n[Image content: AFROTC Det 355 Fall 2026 Organizational Chart, positions only]\nWing leadership: CW/CC (Cadet Wing Commander), CW/CD (Deputy), CW/CSM, CW/Stan & Eval (Standards and Evaluations), GMCA (General Military Course Advisor), COS (Chief of Staff).\nA1 Personnel: AO (Academic Officer); Panda Bears Sq/CC and Hells Angels Sq/CC, each squadron with an AS100 Flight and an AS200 Flight.\nA2 Intelligence: A23 Current Intel, A23 Deputy.\nA3 Operations: A33 CUOPS (Current Operations) with three A33T (trainers); A34 PFO and A34 DPFO; A35 FUOPS (Future Operations).\nA4/7 Logistics & Mission Support: PAO, MWRO/SO, LOGO, FO.\nA5/8 Strategic Plans & Programs: two A53 Ops & Plans, A53 Deputy.\nA9 Assessments & Lessons Learned.\n\n[Page 18]\n3.2 Class Descriptions\n100 First-year cadets enrolled in AS110 or AS120.\n150 First-year cadet beginning in the spring semester enrolled in\nAS120.\n200 Second-year cadets enrolled in AS212 or AS222.\n250 First-year cadets enrolled in AS110 and AS212 or AS120 and\nAS222.\n500 Third-year cadets enrolled in A310 or AS320 class, but still\ncompeting for an EA slot. If selected they will attend Field\nTraining and come back for their 400 level year as a POC.\n300 Third-year cadets enrolled in AS310 or AS320.\n400 Fourth-year cadets enrolled in AS410 or AS420.\n700 Cadets that have completed all AS and LLAB requirements, but\nhave not graduated.\n800 Like a 700, but still receives scholarship incentives (usually\n5-year program cadets).\n3.3 Cadet Classifications\n\u2756 Basic Cadet (BC): Cadets who are part of the GMC class but are not\nscheduled to attend FT, normally AS100s and AS150s.\n\u2756 Basic Cadet Leader (BCL): GMC cadets scheduled to attend FT in the\nupcoming year, normally AS200, AS250 or AS500 cadets.\n\u2756 Intermediate Cadet Leader (ICL): Cadets returning from FT,\nnormally AS300 cadets\n\u2756 Senior Cadet Leaders (SCL): Cadets scheduled to be commissioned in\nthe upcoming year, normally AS400 cadets.\n\u2756 Extended Cadet Leaders (ECL): Similar to AS400s but have already\ncompleted AFROTC program requirements. In the program for an extra\nyear, usually as a result of a five-year academic program.\n\n[Page 19]\nSection 4: Important Documents\n4.1 Physical Fitness Assessment (PFA)\n\u2756 What: The PFA is the Air Force\u2019s Physical Fitness Assessment. The\nPFA consists of a 1.5-mile run, 1 minute of push-ups, and 1 minute of\nsit-ups. The week of the PFA, your height, weight, and (if needed) waist\nmeasurement will be taken.\n\u2756 Here <https://drive.google.com/file/d/1i21A-d70_rvw0NLEa2F4L9ItjRPCJpb1/view?usp=share_link> are directions for the exercises tested on the PFA.\n\u2756 When it is time to take a PFA, a fitness screening questionnaire and a\nscorecard sheet will be provided online and need to be printed prior to\nthe assessment.\n\u27a2 Note: Women and men have different PFA score charts, which\ncan be found below, and all PFA score charts can also be found\nhere <https://www.afpc.af.mil/Portals/70/documents/FITNESS/5%20Year%20Chart%20Scoring%20Including%20Optional%20Component%20Standards%20-%2020211111%200219.pdf?ver=5t5V-6NAFFYCQQuhB05ZTw%3d%3d> (keep scrolling towards the end for women standards).\n\u27a2 Additionally: Detachment 355 currently only completes the\npush-up, sit-up, and 1.5-mile run components of the PFA.\nElection to complete any of the alternative PFA components is at\nthe discretion of Cadre.\n4.1.1 Height and Weight Requirements\n[Image content transcribed: Height and Weight table \u2014 Height (inches): Max Weight (lbs) / Min Weight (lbs)]\n58: 131 / 91; 59: 136 / 94; 60: 141 / 97; 61: 145 / 100; 62: 150 / 104; 63: 155 / 107; 64: 160 / 110; 65: 165 / 114; 66: 170 / 117; 67: 175 / 121; 68: 180 / 125; 69: 186 / 128; 70: 191 / 132; 71: 197 / 136; 72: 202 / 140; 73: 208 / 144; 74: 214 / 148; 75: 220 / 152; 76: 225 / 156; 77: 231 / 160; 78: 237 / 164; 79: 244 / 168; 80: 250 / 173\n\n[Page 20]\n4.2 Memorandum for Record (MFR)\n\u2756 An official MFR can be used to request an excused absence from a\nmandatory Practical Military Training (PMT) event such as PT or\nLLAB. Examples of excusable reasons would be having an exam during\nthe same time as a mandatory PMT event or having a co-op or clinical.\nAn MFR must be submitted directly to the OFC no later than one\nWeek BEFORE the date from which you are requesting to be excused.\nOnce it is known whether the request has been approved or denied, you\nwill be notified from the OFC. If approved, you are required to make up\nwhat you missed, if applicable.\n\u27a2 Here <https://docs.google.com/document/d/1dNdDfcc44YUZHsrFrlIdDWEDH8JsqZsA/edit?usp=drivesdk&ouid=107309851077948394366&rtpof=true&sd=true> is the template for a MFR (do not edit the template and\ndownload as a Word doc before editing).\n\n[Page 21]\nSection 5: Customs and Courtesies\n5.1 Crucial Information: The following information does not encompass\nall Customs and Courtesies, but will likely cover your bases for every AFROTC\nevent you will attend.\n\u2756 What: In AFROTC, customs and courtesies are essential and should be\nfollowed with utmost respect.\n\u2756 Titles and Address: When speaking to any member of the military, you\nmust address them properly.\n\u27a2 All cadets must greet cadre with the proper time and Rank (Last\nName). \u201cGood Morning/Good Afternoon/Good Evening,\nCaptain Watts\u201d Greet officers as \"Rank Last Name\" or\n\"Sir/Ma'am.\" Address enlisted members similarly. During PMT,\ncadets address each other as \"Cadet Last Name.\"\n\u25a0 \u2018Good Morning\u2019 lasts from 0000 to 1159\n\u25a0 \u2018Good Afternoon\u2019 lasts from 1200 to 1659\n\u25a0 \u2018Good Evening\u2019 lasts from 1700 to 2359\n\u27a2 GMC cadets are expected to do the same type of greeting for\nPOC cadets. An example would be \u201cGood Morning, Cadet\nMassari.\u201d GMC cadets do not greet other GMC cadets.\nLikewise, POC cadets do not greet other POC cadets.\n\u27a2 If multiple cadre and/or POC cadets are grouped together, you\nneed to greet them in order of rank, gender, and then name.\n\u25a0 If two or more women or men are grouped together, you\ncan say \u201cGentlemen\u201d or \u201cLadies\u201d instead. However, if\ntwo people are present and you know their names, it is\nrecommended that you greet them using their names. If\nthere is a group of women and men where a woman\nholds the highest rank, you may say \u201cGood evening\nladies and gentlemen.\u201d\n\u27a2 When outside and wearing any uniform with a cover, you must\nsalute officers (and POC cadets if you are a GMC cadet). Only\nwhen the higher-ranked member lowers their salute can the\nlower-ranked member drop theirs.\n\u25a0 If in PTGs, Comp Dress, or inside a building, cadets will\nonly render the proper greeting of the day.\n\u2756 Asking a Question: The proper method by which to raise one\u2019s hand is\nto form a fist with the right hand and raise it straight up so that the bicep\ntouches the ear.\n\u2756 Calling Rooms to Attention: A cadet will call a room to attention\nwhenever an officer is entering or leaving. If it is possible, alert the\nroom to an officer\u2019s imminent entry/departure by saying \u201cstandby.\u201d\n\n[Page 22]\nUpon said officer\u2019s entry/departure, call the room to attention by saying\n\u201cROOM, ATTENTION\u201d (pronounced, \u201cRoom, tench-HUT\u201d) and\nmaintain this position until ordered to do otherwise (usually indicated\nby the officer stating \u201cas you were\u201d). Do not call the room to attention\nfor the entry/departure of a second officer unless the second officer is\nhigher ranking (e.g., if a Lieutenant Colonel is already in the room and a\nMajor walks in, cadets will not call the room to attention). Moreover,\ncadets will not call the room to attention in the middle of an academic\nsetting, such as AS class or during LLAB Training Blocks. However,\ncadets will always call the room to attention, no exceptions, if an officer\nof any service ranking Colonel (O-6) or higher enters/departs. If a cadet\nis alone, they do not call the room to attention. Instead, the cadet should\ncome to the position of attention and render the proper greeting of the\nday.\n\u2756 For a more in-depth look at Customs and Courtesies, please refer to\nSection 7.1.\n5.2 Ranks: Knowing what ranks look like and what they represent is\nimportant to execute proper Customs and Courtesies.\n\u2756 The following are the AFROTC cadet ranks:\n[Image content transcribed: Cadet Rank chart \u2014 Epaulet rank boards/marks, utility uniform rank pins, rank (abbreviation), highest to lowest]\nCadet Colonel (C/Col): four stripes on epaulet; pin with four bars.\nCadet Lieutenant Colonel (C/Lt Col): three stripes; pin with four bars (different pattern).\nCadet Major (C/Maj): three stripes; pin with three bars.\nCadet Captain (C/Capt): two stripes; pin with three bars.\nCadet First Lieutenant (C/1Lt): two stripes; pin with two bars.\nCadet Second Lieutenant (C/2Lt): one stripe; pin with one bar.\nCadet Third Class (C/3C): two diagonal slashes on epaulet; double chevron pin.\nCadet Fourth Class (C/4C): one diagonal slash on epaulet; single chevron pin.\n(Officer-grade cadet ranks C/2Lt and up are POC; C/3C and C/4C are GMC.)\n\n[Page 23]\n\u2756 The following images show USAF/USSF officer ranks (same for both,\nfirst image) as well as enlisted ranks for the USAF (first image) and\nthen for the USSF (second image):\n[Image content transcribed: Air Force & Space Force ranks]\nOfficer (same for USAF and USSF): O-1 Second Lieutenant (gold bar), O-2 First Lieutenant (silver bar), O-3 Captain (two silver bars), O-4 Major (gold oak leaf), O-5 Lieutenant Colonel (silver oak leaf), O-6 Colonel (eagle), O-7 Brigadier General (1 star), O-8 Major General (2 stars), O-9 Lieutenant General (3 stars), O-10 General (4 stars).\nUSAF Enlisted: E-1 Airman Basic (no insignia), E-2 Airman, E-3 Airman First Class, E-4 Senior Airman, E-5 Staff Sergeant, E-6 Technical Sergeant, E-7 Master Sergeant / First Sergeant, E-8 Senior Master Sergeant / First Sergeant, E-9 Chief Master Sergeant / First Sergeant / Command Chief Master Sergeant (star device denotes an E-9 serving in a 9E000 position as a command's senior enlisted adviser) / Chief Master Sergeant of the Air Force / Senior Enlisted Advisor of the U.S. Space Force.\n\n[Page 24]\n[Image content transcribed: U.S. Space Force Enlisted Rank Insignia]\nSpecialist Tier: E-1 Specialist 1, E-2 Specialist 2, E-3 Specialist 3, E-4 Specialist 4.\nNon-Commissioned Officer Tier: E-5 Sergeant, E-6 Technical Sergeant.\nSenior Non-Commissioned Officer Tier: E-7 Master Sergeant, E-8 Senior Master Sergeant, E-9 Chief Master Sergeant, E-9 Chief Master Sergeant of the Space Force.\n\n[Page 25]\n\u2756 The following are the ranks of the Joint Force:\n[Image content transcribed: Ranks of the Joint Force]\nArmy \u2014 Officers: O-1 2nd Lieutenant, O-2 1st Lieutenant, O-3 Captain, O-4 Major, O-5 Lieutenant Colonel, O-6 Colonel, O-7 Brigadier General, O-8 Major General, O-9 Lieutenant General, O-10 General (General of the Army reserved for wartime only). Warrant: W-1 Warrant Officer 1, W-2 to W-5 Chief Warrant Officer 2-5. Enlisted: E-1 Private, E-2 Private E-2, E-3 Private First Class, E-4 Corporal / Specialist, E-5 Sergeant, E-6 Staff Sergeant, E-7 Sergeant First Class, E-8 Master Sergeant / First Sergeant, E-9 Sergeant Major / Command Sergeant Major / Sergeant Major of the Army.\nNavy & Coast Guard \u2014 Officers: O-1 Ensign, O-2 Lieutenant Junior Grade, O-3 Lieutenant, O-4 Lieutenant Commander, O-5 Commander, O-6 Captain, O-7 Rear Admiral Lower Half, O-8 Rear Admiral Upper Half, O-9 Vice Admiral, O-10 Admiral (Fleet Admiral reserved for wartime only). Warrant: W-1 USN Warrant Officer 1, W-2 to W-5 USN Chief Warrant Officer 2-5. Enlisted: E-1 Seaman Recruit, E-2 Seaman Apprentice, E-3 Seaman, E-4 Petty Officer Third Class, E-5 Petty Officer Second Class, E-6 Petty Officer First Class, E-7 Chief Petty Officer, E-8 Senior Chief Petty Officer, E-9 Master Chief Petty Officer / Fleet/Command Master Chief Petty Officer / Master Chief Petty Officer of the Navy and Coast Guard.\nMarine Corps \u2014 Officers: O-1 2nd Lieutenant through O-10 General (same titles as Army). Warrant: W-1 Warrant Officer 1, W-2 to W-5 Chief Warrant Officer 2-5. Enlisted: E-1 Private, E-2 Private First Class, E-3 Lance Corporal, E-4 Corporal, E-5 Sergeant, E-6 Staff Sergeant, E-7 Gunnery Sergeant, E-8 Master Sergeant / First Sergeant, E-9 Master Gunnery Sergeant / Sergeant Major / Sergeant Major of the Marine Corps.\n\n[Page 26]\nSection 6: Frequently Asked Questions (FAQs)\nFAQ 1: How do I keep track of ROTC suspenses and all of\nmy schoolwork?\n- Utilize various time management systems like Google Spreadsheet for suspense\nand homework tracking, Google Calendar, phone reminders, etc..\n- Utilize the systems that best work for you. Expect a trial and error period.\n- Create bookmarks at the top of your computer interface for access to quick\nlinks (SAVE THE CADET GUIDE TO BOOKMARKS)!\n- Complete all easy tasks (i.e. checking off your name on a spreadsheet, filling\nout a short Google Form, etc\u2026) because they are the most commonly missed.\n- Make sure Slack notifications are turned on and follow the Information\nmanagement Policy in the resources section below for issues with emails going\nto your spam folder.\n- Save all of your email and account usernames and passwords somewhere for\neasy access (Ex. WINGs username and password in your phone note app and\nlock it with a passcode).\n- Check what services your school provides its students (Ex. Access to PDF\nreaders, printing, news, steaming services, etc\u2026)\n- Find examples of using Google Spreadsheet (sort assignment for ROTC and\nschoolwork by due date), Google Calendar, and phone reminders\u2026.\n-\n\n[Page 27]\n-\n-\n\n[Page 28]\nFAQ 2: What is a memorandum and how do I write one?\n- Utilize the Tongue & Quill <https://drive.google.com/file/d/0B_LH9D5o0gvtcmg2TW1SdkxQN1U/view?usp=drive_link&resourcekey=0-oY5_9wBW2jXwP9L2wpFUFQ> and MFR Template <https://docs.google.com/document/d/1dNdDfcc44YUZHsrFrlIdDWEDH8JsqZsA/edit> for proper formatting.\n- A memorandum is \u201can official, internal document used for official\ncommunication, policy guidance, or agreements within a Reserve Officers'\nTraining Corps program, outlining expectations, procedures (like\ncommunication plans or training details), or formalizing relationships between\ninstitutions for activities like scholarships, training events, or administrative\nmatters, acting as a standard way to convey information or establish\nresponsibilities between cadets, cadre, and universities.\u201d\n- If you write a Memorandum for Record (MFR) requesting an excused absence\nit must be sent to the OFC No Later Than (NLT) one week before the\nscheduled event!\n- Work with peer GMC to request memorandum help then reach out to direct\nsupervisors if you are still struggling.\nFAQ 3: When will I receive my uniform items?\n- Read the Detachment 355 Cadet Uniform Issue Policy <https://drive.google.com/file/d/1uz1OnfCLR1KahV5u50QDcz7D88YQmETS/view?usp=sharing>\nFAQ 4: What are the week-to-week commitments?\n- You are expected to attend two Physical Training sessions a week lasting\napproximately one hour from 0550 - 0650 (unless the schedule reflects\notherwise).\n- You are expected to attend Leadership Laboratories from 1630 - 1900 on\nWednesdays (unless the schedule reflects otherwise).\n- The detachment will hold optional extra training sessions on occasion to aid\nwith your development.\n- Check the F2026 Master Schedule <https://docs.google.com/spreadsheets/d/1OFH5Kgfc1l9DTc6I7_b9doUh4B1JB_APqcnKnuGCnjQ/edit?usp=sharing> for the entire semester schedule!\nFAQ 6: Who can I ask questions to?\n- Always utilize your peers to ask questions when needed! Most questions you\nhave others will also have or experienced before. Do not be afraid to reach out.\n- Your direct supervisor will be your designated Squadron Commander. The two squadrons are Hells Angels and Panda Bears. They will be in\nconstant communication with the GMC cadets assigned to their squadron.\n- If at any time you do not feel comfortable reaching out to peers, your Squadron\nCommander, or Cadre, the Cadet Wing Standards and Evaluations Officer\n(CW/Stan & Eval) will be available to assist you. You may\n\n[Page 29]\nalso use the anonymous feedback form provided by the CW/Stan & Eval as\nneeded if you do not feel comfortable talking to anyone directly.\nFAQ 7: What should I do when/if I experience burn out?\n- Keep your direct supervisor in the loop and don't be afraid to overcommunicate.\nYour supervisor, mentors, or cadre can help you plan a way forward to set\nyourself up for success in school and in ROTC!\nFAQ 8: Where can I find information?\n- This Cadet Guide!\n- This document will continue to be updated with everything you need for\nsuccess. If at any point the resource links are not available ask your fellow cadets first, then your Squadron Commander.\n- CHECK THE RESOURCES BELOW\u2026\nSection 7: AFROTC Resources\nCustoms and Courtesies\n1. AFH 1-1 Air Force Standards <https://static.e-publishing.af.mil/production/1/af_cc/publication/afi1-1/afi1-1.pdf> (Section 1.8, Customs & Courtesies)\n2. AFI 34-1201 <https://milreg.com/File.aspx?id=3020#:~:text=AFI%2034-1201%20is%20an%20Air%20Force%20Instruction%20that,courtesies%20for%20distinguished%20visitors%2C%20events%2C%20and%20military%20functions.> (Chapter 8, Customs and Courtesies)\n3. Customs and Courtesies <https://docs.google.com/document/d/13ILigpEeTlu5JLsuOQBCZTn6bC9KXvLzAcI2L1LbjAA/edit?usp=sharing> (Extra information)\nDrill and Ceremonies\n4. DAFPAM 34-1203 Drill and Ceremonies <https://drive.google.com/file/d/1uIrGHzGheUF75OsqOFbxKZ-eYTwSMo6K/view>\nUniforms\n5. AFI 36-2903 <https://static.e-publishing.af.mil/production/1/af_a1/publication/dafi36-2903/dafi36-2903.pdf> (Contains USAF uniform and appearance standards)\n6. DAFI 36-2903 AFROTC Supplement <https://afrotc.info/user/pages/05.resources/DAFI-36-2903_AFROTCSup-Dress-and-Appearance.pdf>\n7. Detachment 355 Cadet Uniform Issue Policy <https://drive.google.com/file/d/1uz1OnfCLR1KahV5u50QDcz7D88YQmETS/view?usp=sharing>\n8. Types of Uniforms\na. Operational Camouflage Uniform (OCP)\nb. Long Sleeve Blues (LSB)\nc. Short Sleeve Blues (SSB)\nd.   a: `**Aerospace Studies (AS) courses:**
- **AS100 (AS 110 & 120), Heritage and Values, 1 credit:** an introduction to the USAF and USSF, their missions and characteristics.
- **AS200 (AS 212 & 222), Team and Leadership Fundamentals, 1 credit:** the foundations of teams and leadership. Prepares you for FT and the POC.
- **AS300 (AS 310 & 320), Leading People and Effective Communication, 3 credits:** advanced leadership and management, practiced as upperclassmen.
- **AS400 (AS 410 & 420), National Security Affairs and Preparation for Active Duty, 3 credits:** the military as an institution and a profession, with student presentations.` },

{ id: "classes", q: "What do AS100, 150, 250, 500, 700 and 800 mean?", p: "18",
  k: ["100", "150", "250", "500", "700", "800", "class year", "what is a 250", "what is a 500", "what is a 700", "what is an 800"],
  a: `- **100:** first-year, in AS110 or AS120
- **150:** first-year starting in spring, in AS120
- **200:** second-year, in AS212 or AS222
- **250:** first-year taking AS110 + AS212, or AS120 + AS222
- **300:** third-year, in AS310 or AS320
- **500:** third-year in AS310/320 but **still competing for an EA**. If selected, they attend FT and come back for a 400 year as POC.
- **400:** fourth-year, in AS410 or AS420
- **700:** finished all AS and LLAB requirements but hasn't graduated
- **800:** like a 700 but **still receives scholarship incentives**, usually a 5-year program` },

{ id: "classif", q: "What are BC, BCL, ICL, SCL and ECL?", p: "18",
  k: ["bc", "bcl", "icl", "scl", "ecl", "basic cadet", "cadet leader", "classification"],
  a: `- **Basic Cadet (BC):** GMC, not scheduled for FT. Normally AS100s and 150s.
- **Basic Cadet Leader (BCL):** GMC scheduled for FT next year. Normally AS200, 250 or 500.
- **Intermediate Cadet Leader (ICL):** back from FT. Normally AS300s.
- **Senior Cadet Leader (SCL):** commissioning in the upcoming year. Normally AS400s.
- **Extended Cadet Leader (ECL):** like an AS400 but already finished program requirements. Usually in for an extra year because of a 5-year academic program.` },

{ id: "gmcpoc", q: "What's the difference between GMC and POC?", p: "17",
  k: ["gmc", "poc", "general military course", "professional officer course", "upperclassmen", "underclassmen", "cadet wing", "structure"],
  a: `The Cadet Wing is set up like a real active-duty Air Force wing.
- **POC (Professional Officer Course):** upperclassmen who hold positions and do duties like Department of the Air Force officers.
- **GMC (General Military Course):** underclassmen in subordinate roles, similar to enlisted personnel.

The split lets POC cadets train and mentor GMC cadets.` },

{ id: "org", q: "How is the Cadet Wing organized?", p: "17",
  k: ["org chart", "organizational chart", "organization", "directorate", "a1", "a2", "a3", "a4", "a5", "a9", "wing commander", "staff", "squadron", "squadrons", "hells angels", "panda bears", "flight", "cos", "chief of staff", "csm", "a33", "a34", "a35", "a53", "pfo", "pao", "logo", "mwro", "fo", "ao", "positions"],
  a: `**Wing leadership:** Wing Commander (CW/CC), Deputy Commander (CW/CD), CW/CSM, Standards and Evaluations (CW/Stan & Eval), GMC Advisor (GMCA), and Chief of Staff (COS).

**Directorates under the COS:**
- **A1 Personnel:** Academic Officer (AO), plus the two squadrons
- **A2 Intelligence:** A23 Current Intel and A23 Deputy
- **A3 Operations:** A33 Current Ops (CUOPS) with A33 Trainers (A33T), A34 Physical Fitness Officer (PFO) and Deputy (DPFO), A35 Future Ops (FUOPS)
- **A4/7 Logistics & Mission Support:** PAO, MWRO/SO, LOGO, and Finance Officer (FO)
- **A5/8 Strategic Plans & Programs:** two A53 Ops & Plans officers and an A53 Deputy
- **A9 Assessments & Lessons Learned**

**Squadrons:** GMC cadets are in two squadrons, **Panda Bears** and **Hells Angels**. Each has an AS100 flight and an AS200 flight. Your **Squadron Commander (Sq/CC) is your direct supervisor**.

For who holds each position, see the org chart in the Cadet Guide (p. 17). Squadron position rotations: [Hells Angels](${L.haRotation}) · [Panda Bears](${L.pbRotation})` },

{ id: "greet", q: "How do I greet cadre and cadets?", p: "21",
  k: ["greet", "greeting", "good morning", "good afternoon", "good evening", "hello", "sir", "maam", "ma'am", "titles", "greeting of the day", "what do i say"],
  a: `Greet cadre with the **time of day + Rank Last Name**, for example "Good morning, Captain (Last Name)". "Sir" or "Ma'am" also works. Address enlisted members the same way. During PMT, cadets call each other "**Cadet Last Name**".

**Times:**
- **Good Morning:** 0000–1159
- **Good Afternoon:** 1200–1659
- **Good Evening:** 1700–2359

**Who greets whom:**
- **GMC cadets greet POC cadets** the same way ("Good morning, Cadet (Last Name)").
- GMC don't greet other GMC, and POC don't greet other POC.

**Groups:**
- Greet in order of **rank, then gender, then name**.
- For a group of only men or only women, "Gentlemen" or "Ladies" works. With just two people you know, use their names.
- For a mixed group where a woman is the highest rank: "Good evening, ladies and gentlemen."` },

{ id: "salute", q: "When do I salute?", p: "8, 21",
  k: ["!salute", "!saluting", "cover", "outside", "hat"],
  a: `**Salute** officers (and **POC cadets, if you're GMC**) when you're **outside, in a uniform with a cover**.
- Hold your salute until the higher-ranking person **lowers theirs**.
- **In PTGs, Comp Dress, or inside a building**, just give the greeting of the day.
- **Don't salute NCOs** when reporting in.` },

{ id: "attention", q: "When do I call the room to attention?", p: "9, 21–22",
  k: ["attention", "room attention", "call the room", "tench hut", "as you were", "standby", "officer enters", "officer walks in"],
  a: `**Call the room to attention whenever an officer enters or leaves.** Say "**Standby**" first if you see them coming, then "**ROOM, ATTENTION**" ("Room, tench-HUT"). Hold it until told otherwise, usually "**As you were**".

**Exceptions:**
- **Don't call it again for a second officer** unless they outrank the first.
- **Don't call it in the middle of an academic setting** like AS class or an LLAB training block. However, **Colonel (O-6) and above always get it, no exceptions.**
- **If you're alone,** come to attention and give the greeting of the day.
- **NCO enters:** no need to call attention, but give the greeting.
- **In the hangar:** just give the greeting of the day.` },

{ id: "hand", q: "How do I ask a question in class?", p: "21",
  k: ["raise hand", "raise my hand", "ask a question", "asking a question", "fist"],
  a: `Make a **fist with your right hand** and raise it straight up so your **bicep touches your ear**.` },

{ id: "report", q: "How do I report in to an officer?", p: "8",
  k: ["report in", "reporting in", "reports as ordered", "knock", "office", "will that be all"],
  a: `1. **Center yourself** on the door and **knock once loudly**. If the door is open, knock once on the frame.
2. When told to enter, **march to two paces in front** of the officer. Square corners on hardwood, round them on carpet.
3. **Salute** and say "**Sir/Ma'am, Cadet (Last Name) reports as ordered.**" Hold the salute until they drop theirs. Stay at attention unless told otherwise.
4. At the end, ask "**Will that be all, Sir/Ma'am?**"
5. When they say "That will be all," come to attention, **take one step back** (left foot first, with a coordinated arm swing), **salute**, and give the greeting of the day.
6. After they drop their salute, face toward the exit and **leave promptly**. Leave the door the way you found it.

Don't salute NCOs when reporting in.` },

{ id: "meeting", q: "How do I schedule and show up to a meeting with cadre?", p: "7–8",
  k: ["meeting", "schedule a meeting", "appointment", "meet with cadre", "calendar", "calendly", "midterm feedback", "feedback", "call up", "calling up", "chq phone", "extension"],
  a: `**Scheduling:**
1. Check the cadre member's BU calendar on Google Calendar. If you don't have access, politely request it by email.
2. Email them a **date, time, purpose, and an alternative time**.
3. Once they confirm, they'll give you times that work for them. If your time doesn't work, they'll reply with a new one.

**Template email:**
- "Good (morning/afternoon/evening) (Rank Last Name),"
- "I would like to schedule a meeting regarding (purpose of meeting). I checked your calendar and am available at the following times:" then list Option 1 and Option 2 (day, date, time).
- "Please let me know if any of these times work for you. If not, let me know a time that fits your schedule and I will adjust accordingly. Thank you."
- Close with "V/r," then "Cadet (Last Name)" and your signature block.

**Midterm feedback and AS class meetings:** follow the scheduling instructions in your AS class syllabus.

**Arriving:**
- Go to **118 Bay State Rd**, through the **back door to CHQ**. The door code is given at the start of the semester.
- **Arrive 10 minutes early.** If CHQ is closed, ring the front doorbell.

**Calling up:**
- At the **exact meeting time**, call their extension from the **CHQ phone**: "Good (morning/afternoon/evening) sir/ma'am. This is Cadet (Last Name). I am here for my meeting at (time)."
- When directed up, take the small interior staircase to the ground floor, then the main staircase. **Never use the staircase by the bathroom**, because it leads straight to the commander's office.
- **Running late or can't make it?** Tell them ASAP by phone or email.` },

{ id: "chq", q: "What are the CHQ rules?", p: "8–9",
  k: ["!chq", "cadet headquarters", "headquarters", "just me", "just us", "hangar", "basement", "fridge", "mail", "printer", "guest", "visitor", "sister service", "hours", "closed"],
  a: `**Cadet Headquarters (CHQ)** is in the detachment basement: the front room plus the hangar.

**Entering:**
- Say "**Just me**" when you enter alone. When a group enters, the first person says "**Just us**".
- If someone comes in without calling out, assume it's cadre.
- Don't use the front door while CHQ is open, and **never use the back staircase by the bathroom**.

**Rules:**
- **CHQ is closed 0000–0500.**
- **Guests:** non-ROTC people need prior cadre approval, or it's a security violation. Sister-service cadets sign in by QR code and stay with their sponsor, who is responsible for them. Never give them the code or leave them alone.
- **Fridge:** label food with your name and date, and remove perishables within a week.
- **Mail:** pick up cadet mail **at least every two weeks**.
- **Tidiness:** use the coat rack. White bin is for trash, blue bin for recycling.
- **Logistics Officer (LOGO):** email them about computer or printer issues, and get their approval before storing items.
- **Leaving:** turn off lights and electronics.
- **Greetings:** give cadre proper greetings, or expect verbal counseling.` },

{ id: "cadetrank", q: "What are the cadet ranks?", p: "22",
  k: ["cadet rank", "cadet ranks", "c/col", "c/lt col", "c/maj", "c/capt", "c/1lt", "c/2lt", "c/3c", "c/4c", "third class", "fourth class", "epaulet", "rank board", "rank pin", "shoulder boards"],
  a: `**AFROTC cadet ranks, highest to lowest (epaulet marks / OCP pin):**

- **Cadet Major (C/Maj):** 3 stripes / 3-bar pin
- **Cadet Captain (C/Capt):** 2 stripes / 3-bar pin
- **Cadet First Lieutenant (C/1Lt):** 2 stripes / 2-bar pin

{ id: "afrank", q: "What are the Air Force and Space Force ranks?", p: "23–24",
  k: ["rank", "ranks", "officer ranks", "enlisted ranks", "air force ranks", "space force ranks", "insignia", "lieutenant", "captain", "major", "colonel", "general", "sergeant", "airman", "specialist", "chief"],
  a: `**Officers (same for USAF and USSF):**
- **O-1** 2nd Lieutenant (gold bar), **O-2** 1st Lieutenant (silver bar), **O-3** Captain (two bars)
- **O-4** Major (gold oak leaf), **O-5** Lieutenant Colonel (silver oak leaf), **O-6** Colonel (eagle)
- **O-7** Brigadier General ★, **O-8** Major General ★★, **O-9** Lieutenant General ★★★, **O-10** General ★★★★

**USAF enlisted:**
- **E-1** Airman Basic, **E-2** Airman, **E-3** Airman First Class, **E-4** Senior Airman
- **E-5** Staff Sergeant, **E-6** Technical Sergeant
- **E-7** Master Sergeant, **E-8** Senior Master Sergeant, **E-9** Chief Master Sergeant. First Sergeant is also possible at E-7 to E-9.
- Top E-9 positions: Command Chief, Chief Master Sergeant of the Air Force

**USSF enlisted:**
- **E-1 to E-4** Specialist 1–4
- **E-5** Sergeant, **E-6** Technical Sergeant
- **E-7** Master Sergeant, **E-8** Senior Master Sergeant, **E-9** Chief Master Sergeant
- Top E-9 position: Chief Master Sergeant of the Space Force

Ask about a specific grade, like "What is E-6?", for every branch.` },

  "w-1": "**W-1.** Army and Marines: Warrant Officer 1. Navy: USN Warrant Officer 1.",
  "w-2": "**W-2.** Chief Warrant Officer 2 (Army, Navy, Marines).",
  "w-3": "**W-3.** Chief Warrant Officer 3 (Army, Navy, Marines).",

const ACRONYMS = {
  ABU:"Airman Battle Uniform (retired)", AFCEA:"Armed Forces Communication and Electronics Association", AFOQT:"Air Force Officer Qualifying Test",
  AFROTC:"Air Force Reserve Officer Training Corps", AFSC:"Air Force Specialty Code", ALCON:"All Concerned", AO:"Academic Officer",
  CC:"Commander", CD:"Deputy Commander", COB:"Close Of Business (1630)", COS:"Chief of Staff", CTA:"Cadet Training Assistant", CW:"Cadet Wing",
  DPAO:"Deputy Public Affairs Officer", DFO:"Deputy Finance Officer", DLOGO:"Deputy Logistics Officer", DMWRO:"Deputy Morale Welfare and Readiness Officer",
  EOD:"End of Day (2359)", "FLT/CC":"Flight Commander", FO:"Finance Officer", FSS:"Force Support Squadron", GMC:"General Military Course",
  GMCA:"General Military Course Advisor", ICL:"Intermediate Cadet Leader", IG:"Inspector General", LLAB:"Leadership Laboratory", LOGO:"Logistics Officer",
  LRS:"Logistics Readiness Squadron", LSB:"Long Sleeve Blues", MWRO:"Morale Welfare and Readiness Officer", NCO:"Non-Commissioned Officer",
  NLT:"No Later Than", OCP:"Operational Camouflage Pattern", OFC:"Operations Flight Commander", OPORD:"Operations Order", OSS:"Operations Support Squadron",

  PDT:"Professional Development Training", PME:"Professional Military Education", PMT:"Practical Military Training", POC:"Professional Officer Course",

  APAS:"Assistant Professor of Aerospace Studies", NCOIC:"Non-Commissioned Officer in Charge", CHQ:"Cadet Headquarters", UOD:"Uniform of the Day",

  SCL:"Senior Cadet Leader", ECL:"Extended Cadet Leader", PT:"Physical Training", AS:"Aerospace Studies", USSF:"United States Space Force",
  USAF:"United States Air Force", DAF:"Department of the Air Force", CSO:"Combat Systems Officer", ABM:"Air Battle Manager", PTL:"Physical Training Leader",
  "CW/CC":"Cadet Wing Commander", "CW/CD":"Cadet Wing Deputy Commander", "CW/IG":"Cadet Wing Inspector General", "DET/CC":"Detachment Commander"
};

const GUIDE = JSON.parse(document.getElementById("guide").textContent);
const log = document.getElementById("log"), scroller = document.getElementById("scroller");
const form = document.getElementById("f"), q = document.getElementById("q");
const ESCALATE = "Not sure or not covered? <b>Ask your fellow cadets first, then your Squadron Commander.</b>";

const STARTERS = ["pt", "excuse", "gpa", "greet", "afoqt", "attendance", "ask"];
const STOP = new Set("a an the and or of to in on at for is are am be do does did i me my we you your it its what whats when where who whom how why can could should would will with about from this that there have has need get any if as by".split(" "));

// ---------- text helpers ----------
function norm(s) {
  return " " + s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9/'.\- ]+/g, " ").replace(/\s+/g, " ").trim() + " ";
}
function tokens(s) { return norm(s).trim().split(" ").map(stem).filter(w => w && !STOP.has(w)); }
function stem(w) { return w.replace(/'s$/, "").replace(/(ing|ed|es|s)$/, m => (w.length > 4 ? "" : m)); }
function has(nq, phrase) {
  const p = norm(phrase).trim();
  return nq.includes(" " + p + " ") || (p.length > 4 && nq.includes(" " + p));
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\((pp?\. ?\d+(?:[–-]\d+)?(?:, ?\d+)*)\)/g, '<span class="pg">($1)</span>');
  return s;
}
function md(text) {
  const lines = text.split("\n"); let html = "", list = null, para = [];
  const flushP = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const flushL = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.trim();
    const ul = line.match(/^[-*•]\s+(.*)/), ol = line.match(/^\d+[.)]\s+(.*)/);
    if (!line) { flushP(); flushL(); continue; }
    if (ul || ol) { flushP(); const t = ul ? "ul" : "ol"; if (list !== t) { flushL(); html += `<${t}>`; list = t; } html += "<li>" + inline((ul || ol)[1]) + "</li>"; continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL(); return html;
}
// guide text uses "label <url>"; turn into markdown links
function linkify(text) { return text.replace(/([^\n<]*?)\s*<(https?:\/\/[^>]+)>/g, (m, label, url) => `[${label.trim().replace(/^[❖➢■○o•-]\s*/, "") || "link"}](${url})`); }

// ---------- intent index ----------
const ENTRIES = KB.map(e => ({ ...e, keys: e.k.map(k => ({ p: k.replace(/^!/, ""), w: k.startsWith("!") ? 3 : 0 })), qt: new Set(tokens(e.q)) }));
const BY_ID = Object.fromEntries(ENTRIES.map(e => [e.id, e]));

function scoreIntents(question) {
  const nq = norm(question), qt = tokens(question);
  return ENTRIES.map(e => {
    let s = 0;
    for (const k of e.keys) if (has(nq, k.p)) s += 1 + k.p.split(" ").length + k.w;
    for (const t of qt) if (e.qt.has(t)) s += 0.5;
    return { e, s };
  }).sort((a, b) => b.s - a.s);
}

// ---------- passage search (fallback) ----------
const PASSAGES = GUIDE.split(/\n(?=\[Page \d+\])/).flatMap(pg => {
  const n = (pg.match(/^\[Page (\d+)\]/) || [])[1];
  if (+n <= 5) return []; // cover, leadership letters, table of contents
  return pg.replace(/^\[Page \d+\]\n?/, "").split(/\n(?=❖|➢|FAQ \d|Section \d|\d\.\d )/)
    .map(t => t.trim()).filter(t => t.length > 40 && !/^\[Image content: AFROTC/.test(t)).map(t => ({ n, t, tk: tokens(t) }));
});
const DF = {};
PASSAGES.forEach(p => new Set(p.tk).forEach(t => (DF[t] = (DF[t] || 0) + 1)));
const AVG = PASSAGES.reduce((a, p) => a + p.tk.length, 0) / PASSAGES.length;
function searchPassages(question) {
  const qt = [...new Set(tokens(question))], N = PASSAGES.length;
  return PASSAGES.map(p => {
    let s = 0;
    for (const t of qt) {
      const f = p.tk.filter(x => x === t).length; if (!f) continue;
      const idf = Math.log(1 + (N - DF[t] + 0.5) / (DF[t] + 0.5));
      s += idf * (f * 2.2) / (f + 1.2 * (0.25 + 0.75 * p.tk.length / AVG));
    }
    return { p, s };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
}

// ---------- special answers ----------
function heightWeight(question) {
  const nq = question.toLowerCase();
  let inches = null, m;
  if ((m = nq.match(/(\d)\s*(?:'|ft|feet|foot)\s*(\d{1,2})?/))) inches = (+m[1]) * 12 + (+(m[2] || 0));
  else if ((m = nq.match(/\b(5[89]|[67]\d|80)\s*(?:"|in|inch|inches)?\b/))) inches = +m[1];
  if (inches && HW[inches]) {
    const [max, min] = HW[inches];
    return `At **${inches} inches** (${Math.floor(inches / 12)}'${inches % 12}"), the weight range is **${min}–${max} lbs** (min ${min}, max ${max}).\n\nHeight, weight and (if needed) waist are measured the week of the PFA. You also need to meet body fat standards.`;
  }
  const rows = Object.entries(HW).map(([h, [mx, mn]]) => `<tr><td>${h}" (${Math.floor(h / 12)}'${h % 12}")</td><td>${mx}</td><td>${mn}</td></tr>`).join("");
  return { html: `<p>Height and weight limits (ask with your height, like <strong>"max weight at 5'9"</strong>", for one row):</p><div class="tablewrap"><table><thead><tr><th>Height</th><th>Max lbs</th><th>Min lbs</th></tr></thead><tbody>${rows}</tbody></table></div>` };
}
function schoolAnswer(question) {
  const nq = norm(question);
  const s = SCHOOLS.find(x => x.re.test(nq));
  if (!s) return { text: "Which school are you at? The guide lists academic resources for each:", chips: SCHOOLS.map(x => `Tutoring at ${x.name}`) };
  const i = GUIDE.lastIndexOf(s.start), j = GUIDE.indexOf(s.end, i + s.start.length);
  const body = GUIDE.slice(i + s.start.length, j > 0 ? j : i + 1500).replace(/\[Page \d+\]/g, "");
  const items = linkify(body).split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => (/^❖/.test(l) && !/\]\(/.test(l) ? "**" + l.replace(/^❖\s*/, "") + "**" : "- " + l.replace(/^[❖➢]\s*/, "")));
  return { text: `**Academic resources at ${s.name}:**\n\n` + items.join("\n") };
}
function acronym(question) {
  const raw = question.trim();
  const m = raw.match(/^(?:what\s+(?:does|is|'s)\s+(?:an?\s+)?|what's\s+(?:an?\s+)?|define\s+|meaning of\s+)?["']?([A-Za-z][A-Za-z0-9/\-]{1,7})["']?\s*(?:stand for|mean|means|acronym|abbreviation)?\??$/i);
  if (!m) return null;
  const key = Object.keys(ACRONYMS).find(k => k.toLowerCase() === m[1].toLowerCase());
  if (!key) return null;
  return `**${key}** stands for **${ACRONYMS[key]}**.`;
}

// ---------- answering ----------
function answer(question) {
  const nq = norm(question);
  const rk = nq.match(/\b([oew])\s?-?\s?(10|[1-9])\b/);
  if (rk && /rank|grade|what|who|is|insignia|^ ?[oew]/.test(nq)) {
    const key = rk[1] + "-" + rk[2];
    if (RANKS[key]) return { html: md(RANKS[key]), pages: "23–25", rel: ["afrank", "cadetrank"] };
  }
  const ac = acronym(question);
  const ranked = scoreIntents(question);
  const top = ranked[0];
  if (ac && top.s < 2) {
    const rel = ranked.filter(r => r.s >= 2).slice(0, 2).map(r => r.e.id);
    return { html: md(ac), pages: "34–35", rel };
  }
  if (top.s >= 2) {
    const e = top.e;
    const rel = ranked.slice(1).filter(r => r.s >= Math.max(2, top.s * 0.5)).slice(0, 3).map(r => r.e.id);
    if (e.a === "__HW__") { const r = heightWeight(question); return { html: typeof r === "string" ? md(r) : r.html, pages: e.p, rel }; }
    if (e.a === "__SCHOOL__") { const r = schoolAnswer(question); return { html: md(r.text), pages: e.p, chipsText: r.chips, rel }; }
    return { html: (ac ? md(ac) : "") + md(e.a), pages: e.p, rel };
  }
  const hits = searchPassages(question);
  if (hits.length && hits[0].s > 2.5) {
    const shown = hits.slice(0, 2).filter(h => h.s > hits[0].s * 0.6);
    const html = "<p>Here's the closest match in the Cadet Guide:</p>" +
      shown.map(h => `<div class="hit">${md(linkify(h.p.t))}<span class="pg">(p. ${h.p.n})</span></div>`).join("");
    return { html, escalate: true, rel: ranked.filter(r => r.s > 0).slice(0, 3).map(r => r.e.id) };
  }
  return { html: "<p>I couldn't find that in the Cadet Guide.</p>", escalate: true, rel: ["ask", "resources"] };
}

// ---------- UI ----------
function addMsg(role, html) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who" aria-hidden="true">${role === "bot" ? "CS" : "You"}</div><div class="bubble"></div>`;
  el.querySelector(".bubble").innerHTML = html;
  log.appendChild(el);
  requestAnimationFrame(() => el.scrollIntoView({ block: "start", behavior: "smooth" }));
  return el.querySelector(".bubble");
}
function chipRow(items) {
  const row = document.createElement("div"); row.className = "chips";
  for (const it of items) {
    const label = typeof it === "string" ? it : it.q;
    const c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = label;
    c.onclick = () => ask(label); row.appendChild(c);
  }
  return row;
}
function ask(text) {
  text = text.trim(); if (!text) return;
  addMsg("user", "<p>" + esc(text) + "</p>");
  q.value = ""; autosize();
  const r = answer(text);
  const b = addMsg("bot", r.html);
  if (r.chipsText) b.appendChild(chipRow(r.chipsText));
  if (r.pages) b.insertAdjacentHTML("beforeend", `<div class="src"><span class="pg">Cadet Guide p. ${r.pages}</span></div>`);
  if (r.escalate) b.insertAdjacentHTML("beforeend", `<div class="esc">${ESCALATE}</div>`);
  const rel = (r.rel || []).map(id => BY_ID[id]).filter(Boolean);
  if (rel.length) {
    const wrap = document.createElement("div"); wrap.className = "rel";
    wrap.innerHTML = '<div class="lbl">Related</div>'; wrap.appendChild(chipRow(rel)); b.appendChild(wrap);
  }
}
function welcome() {
  const b = addMsg("bot", md("Good day, cadet. I'm **C/ Snuffy**, your guide to the **Det 355 Cadet Guide (Fall 2026)**. Ask about PT and LLAB, attendance, MFRs, customs and courtesies, ranks, GPA, the AFOQT, cadre contacts, or resources. Some common questions:"));
  b.appendChild(chipRow(STARTERS.map(id => BY_ID[id])));
}
function showTopics() {
  addMsg("user", "<p>Show all topics</p>");
  const b = addMsg("bot", "<p>Here's everything I can help with. Tap a topic:</p>");
  b.appendChild(chipRow(ENTRIES));
}
function autosize() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 140) + "px"; }
q.addEventListener("input", autosize);
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
form.addEventListener("submit", e => { e.preventDefault(); ask(q.value); });
document.getElementById("topics").addEventListener("click", showTopics);
welcome();

</script>
